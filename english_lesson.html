      { en:"My stomach hurts.",   pron:"마이 스터먹 헐츠", ko:"배가 아파요." },
      { en:"I don't feel well.",  pron:"아이 돈ㅌ 필 웰", ko:"몸이 안 좋아요." },
    ], practice:{ ask:"목이 아파요.", en:"My throat hurts.", pron:"마이 쓰로트 헐츠" } },
  { id:"d58", unit:"u14", day:2, titleKo:"병원에서",
    grammar:{ point:"병원 표현", pattern:"see a doctor · It started ~", explain:"진료받고 싶다: see a doctor. 언제부터: It started yesterday(어제부터 그래요)." },
    phrases:[
      { en:"I'd like to see a doctor.", pron:"아이드 라이크 투 씨 어 닥터", ko:"진료받고 싶어요." },
      { en:"It started yesterday.",     pron:"잇 스타티드 예스터데이", ko:"어제부터 그래요." },
      { en:"I have a fever.",           pron:"아이 해브 어 피버", ko:"열이 나요." },
      { en:"It hurts here.",            pron:"잇 헐츠 히어", ko:"여기가 아파요." },
    ], practice:{ ask:"기침이 나요.", en:"I have a cough.", pron:"아이 해브 어 코프" } },
  { id:"d59", unit:"u14", day:3, titleKo:"약국에서",
    grammar:{ point:"약국 표현", pattern:"medicine for ~ · How often?", explain:"~약: medicine for a cold(감기약). 얼마나 자주: How often should I take it?" },
    phrases:[
      { en:"Do you have medicine for a cold?", pron:"두 유 해브 메디슨 포 어 콜드?", ko:"감기약 있어요?" },
      { en:"I need some painkillers.",         pron:"아이 니드 썸 페인킬러즈", ko:"진통제가 필요해요." },
      { en:"How often should I take it?",      pron:"하우 오픈 슈드 아이 테이크 잇?", ko:"얼마나 자주 먹어야 해요?" },
      { en:"Twice a day, please.",             pron:"트와이스 어 데이, 플리즈", ko:"하루 두 번이요." },
    ], practice:{ ask:"두통약 있어요?", en:"Do you have medicine for a headache?", pron:"두 유 해브 메디슨 포 어 헤데이크?" } },
  { id:"d60", unit:"u14", day:4, titleKo:"몸 상태·회복",
    grammar:{ point:"회복·상태", pattern:"I feel better · Take care", explain:"나아지다: I feel better. 몸조심하세요: Take care. 빨리 나으세요: Get well soon." },
    phrases:[
      { en:"I feel better now.", pron:"아이 필 베러 나우", ko:"이제 좀 나아요." },
      { en:"Get some rest.",     pron:"겟 썸 레스트", ko:"좀 쉬세요." },
      { en:"Take care.",         pron:"테이크 케어", ko:"몸조심하세요." },
      { en:"Get well soon.",     pron:"겟 웰 쑨", ko:"빨리 나으세요." },
    ], practice:{ ask:"이제 괜찮아요.", en:"I feel okay now.", pron:"아이 필 오케이 나우" } },

  { id:"d61", unit:"u15", day:1, titleKo:"전화하기",
    grammar:{ point:"전화 표현", pattern:"this is ~ · Can I speak to ~?", explain:"전화에서 ‘저는 ~예요’는 This is ~. ~와 통화 가능해요? Can I speak to ~?" },
    phrases:[
      { en:"Hello, this is Minjeong.", pron:"헬로우, 디스 이즈 민정", ko:"여보세요, 민정이에요." },
      { en:"Can I speak to Sumi?",     pron:"캔 아이 스픽 투 수미?", ko:"수미랑 통화할 수 있어요?" },
      { en:"Please call me back.",     pron:"플리즈 콜 미 백", ko:"다시 전화 주세요." },
      { en:"I'll call you later.",     pron:"아일 콜 유 레이러", ko:"나중에 전화할게요." },
    ], practice:{ ask:"다시 전화 주세요.", en:"Please call me back.", pron:"플리즈 콜 미 백" } },
  { id:"d62", unit:"u15", day:2, titleKo:"시간 약속 (at·on·in)",
    grammar:{ point:"시간 전치사 at·on·in", pattern:"at 시각 · on 요일 · in 달", explain:"시각엔 at(at 3), 요일·날짜엔 on(on Monday), 달·계절엔 in(in May)." },
    phrases:[
      { en:"Let's meet at three.",    pron:"렛츠 밋 앳 쓰리", ko:"3시에 만나요." },
      { en:"See you on Friday.",      pron:"씨 유 온 프라이데이", ko:"금요일에 봐요." },
      { en:"My birthday is in May.",  pron:"마이 버스데이 이즈 인 메이", ko:"제 생일은 5월이에요." },
      { en:"Are you free tomorrow?",  pron:"아 유 프리 투마로우?", ko:"내일 시간 있어요?" },
    ], practice:{ ask:"월요일에 만나요.", en:"Let's meet on Monday.", pron:"렛츠 밋 온 먼데이" } },
  { id:"d63", unit:"u15", day:3, titleKo:"이웃과 잡담",
    grammar:{ point:"가벼운 인사·잡담", pattern:"How's it going? · Long time no see", explain:"잘 지내요?: How's it going? 오랜만이에요: Long time no see." },
    phrases:[
      { en:"How's it going?",            pron:"하우즈 잇 고잉?", ko:"잘 지내요?" },
      { en:"Long time no see.",          pron:"롱 타임 노 씨", ko:"오랜만이에요." },
      { en:"The weather is nice today.", pron:"더 웨더 이즈 나이스 투데이", ko:"오늘 날씨 좋네요." },
      { en:"Have a nice day.",           pron:"해브 어 나이스 데이", ko:"좋은 하루 보내세요." },
    ], practice:{ ask:"오랜만이에요.", en:"Long time no see.", pron:"롱 타임 노 씨" } },
  { id:"d64", unit:"u15", day:4, titleKo:"비교하기 + 이유 (because)",
    grammar:{ point:"비교급 -er 과 because", pattern:"더 ~한: bigger·cheaper / 왜냐하면 because", explain:"비교는 형용사+er (bigger 더 큰, cheaper 더 싼). 이유는 because(왜냐하면)." },
    phrases:[
      { en:"This one is cheaper.",            pron:"디스 원 이즈 치퍼", ko:"이게 더 싸요." },
      { en:"That one is bigger.",             pron:"댓 원 이즈 비거", ko:"저게 더 커요." },
      { en:"I like this because it's fresh.", pron:"아이 라이크 디스 비코즈 잇츠 프레시", ko:"신선해서 이게 좋아요." },
      { en:"It's better than before.",        pron:"잇츠 베러 댄 비포", ko:"전보다 나아요." },
    ], practice:{ ask:"이게 더 좋아요.", en:"This one is better.", pron:"디스 원 이즈 베러" } },
];

const PAPER="#FBF3E7", CARD="#FFFFFF";
const INK="#3A2C22", INK2="#6B5849", INK3="#9A8674";
const FONT_KO="'Gowun Dodum','Noto Sans KR',sans-serif";
const FONT_EN="'Nunito','Noto Sans KR',sans-serif";

const todayStr=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

function App(){
  const [done,setDone]=useState({});
  const [studyDates,setStudyDates]=useState({});
  const [showAns,setShowAns]=useState({});
  const [activeUnit,setActiveUnit]=useState("u1");
  const [lang,setLang]=useState("both");
  const [scale,setScale]=useState(1);
  const [loaded,setLoaded]=useState(false);
  const [practiceUnit,setPracticeUnit]=useState(null);
  const KEY="mom_english_v2";

  useEffect(()=>{
    try{ const r=window.localStorage.getItem(KEY);
      if(r){ const o=JSON.parse(r); setDone(o.done||{}); setStudyDates(o.studyDates||{}); if(o.scale) setScale(o.scale); if(o.lang) setLang(o.lang); }
    }catch(e){}
    setLoaded(true);
  },[]);
  useEffect(()=>{ if(!loaded) return; try{ window.localStorage.setItem(KEY,JSON.stringify({done,studyDates,scale,lang})); }catch(e){} },[done,studyDates,scale,lang,loaded]);

  const speak=(text)=>{ try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/[?.!,]/g," "));
    u.lang="en-US"; u.rate=0.78; u.pitch=1.0; window.speechSynthesis.speak(u);
  }catch(e){} };

  const toggleDone=(id)=>{ setDone(d=>{ const nd={...d,[id]:!d[id]}; if(!d[id]) setStudyDates(sd=>({...sd,[todayStr()]:true})); return nd; }); };
  const toggleAns=(id)=> setShowAns(a=>({...a,[id]:!a[id]}));

  const showKo=lang==="ko"||lang==="both";
  const showEn=lang==="en"||lang==="both";
  const S=scale;

  const total=DAYS.length;
  const doneCount=DAYS.filter(d=>done[d.id]).length;
  const pct=Math.round(doneCount/total*100);
  const nextDay=DAYS.find(d=>!done[d.id])||null;

  const streak=(()=>{ let n=0; const d=new Date();
    for(;;){ const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      if(studyDates[s]){ n++; d.setDate(d.getDate()-1);} else break; } return n; })();

  const reviewFor=(idx)=>{ if(idx<=0) return [];
    const out=[]; const prev=DAYS[idx-1]; out.push({...prev.phrases[0], from:prev});
    const olderIdx=Math.max(0,idx-3);
    if(olderIdx!==idx-1){ const o=DAYS[olderIdx]; out.push({...(o.phrases[1]||o.phrases[0]), from:o}); }
    return out; };

  const unitInfo=(uid)=>UNITS.find(u=>u.id===uid);
  const unitDays=(uid)=>DAYS.filter(d=>d.unit===uid);
  const unitDoneCount=(uid)=>unitDays(uid).filter(d=>done[d.id]).length;

  const ap=unitInfo(activeUnit), C=ap.color, BG=ap.bg;

  const dayRefs=useRef({});
  const goToNext=()=>{ if(!nextDay) return; setActiveUnit(nextDay.unit);
    setTimeout(()=>{ const el=dayRefs.current[nextDay.id]; if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); },80); };

  if(practiceUnit){
    return <Flashcards unit={unitInfo(practiceUnit)} days={unitDays(practiceUnit)} speak={speak} onClose={()=>setPracticeUnit(null)} S={S} />;
  }

  return (
    <div style={{minHeight:"100vh", background:PAPER, fontFamily:FONT_KO, color:INK, paddingBottom:80}}>
      <div style={{background:"linear-gradient(135deg,#E07A5F,#C16B8F)", color:"#fff", padding:"26px 20px 30px", borderBottomLeftRadius:26, borderBottomRightRadius:26, boxShadow:"0 6px 20px rgba(224,122,95,0.3)"}}>
        <div style={{maxWidth:560, margin:"0 auto"}}>
          <div style={{fontSize:13*S, fontWeight:700, letterSpacing:"0.1em", opacity:0.92}}>기초 문법 + 일상 회화 · 15단원 64일</div>
          <div style={{fontSize:30*S, fontWeight:900, marginTop:6, lineHeight:1.2, fontFamily:FONT_KO}}>엄마의 매일 영어 🌷</div>
          <div style={{fontSize:15*S, marginTop:8, opacity:0.95, lineHeight:1.5}}>오늘은 문법 한 가지! 그걸로 <b>직접 문장을 만들어</b> 봐요.<br/>외우는 영어가 아니라 <b>스스로 말하는 영어</b>예요.</div>
          <div style={{display:"flex", gap:10, marginTop:18, flexWrap:"wrap"}}>
            <div style={{flex:"1 1 150px", background:"rgba(255,255,255,0.22)", borderRadius:16, padding:"12px 14px"}}>
              <div style={{fontSize:13*S, fontWeight:700, opacity:0.95, display:"flex", justifyContent:"space-between"}}><span>전체 진행</span><span>{doneCount}/{total}일</span></div>
              <div style={{height:11, background:"rgba(255,255,255,0.35)", borderRadius:99, overflow:"hidden", marginTop:8}}>
                <div style={{height:"100%", width:pct+"%", background:"#fff", borderRadius:99, transition:"width .5s"}} />
              </div>
            </div>
            <div style={{flex:"0 0 auto", background:"rgba(255,255,255,0.22)", borderRadius:16, padding:"12px 18px", textAlign:"center"}}>
              <div style={{fontSize:24*S, fontWeight:900, lineHeight:1}}>🔥 {streak}</div>
              <div style={{fontSize:12*S, fontWeight:700, marginTop:4, opacity:0.95}}>일 연속</div>
            </div>
          </div>
        </div>
      </div>

      <div style={{maxWidth:560, margin:"0 auto", padding:"0 16px"}}>
        <div style={{background:CARD, borderRadius:18, padding:"14px 16px", marginTop:-16, boxShadow:"0 4px 14px rgba(58,44,34,0.08)", border:"1px solid #efe3d0"}}>
          <div style={{display:"flex", alignItems:"center", gap:10, flexWrap:"wrap"}}>
            <span style={{fontSize:14*S, fontWeight:700, color:INK2}}>글씨 크기</span>
            {[["보통",1],["크게",1.18],["아주 크게",1.38]].map(([lb,v])=>(
              <button key={lb} onClick={()=>setScale(v)} style={{fontSize:14*S, fontWeight:800, padding:"7px 13px", borderRadius:12, cursor:"pointer", border:"2px solid "+(scale===v?"#E07A5F":"#e6d8c2"), background:scale===v?"#FBEAE3":"#fff", color:scale===v?"#C25A40":INK2, fontFamily:FONT_KO}}>{lb}</button>
            ))}
          </div>
          <div style={{display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginTop:11, paddingTop:11, borderTop:"1px dashed #ecdfca"}}>
            <span style={{fontSize:14*S, fontWeight:700, color:INK2}}>보기 방식</span>
            {[["한글+영어","both"],["영어만","en"],["한글만","ko"]].map(([lb,v])=>(
              <button key={v} onClick={()=>setLang(v)} style={{fontSize:14*S, fontWeight:800, padding:"7px 13px", borderRadius:12, cursor:"pointer", border:"2px solid "+(lang===v?"#E07A5F":"#e6d8c2"), background:lang===v?"#FBEAE3":"#fff", color:lang===v?"#C25A40":INK2, fontFamily:FONT_KO}}>{lb}</button>
            ))}
          </div>
        </div>

        {nextDay ? (
          <div onClick={goToNext} style={{cursor:"pointer", marginTop:14, background:"#fff", border:"2.5px solid #E07A5F", borderRadius:20, padding:"18px", boxShadow:"0 4px 14px rgba(224,122,95,0.15)"}}>
            <div style={{fontSize:13*S, fontWeight:800, color:"#C25A40", letterSpacing:"0.05em"}}>👉 오늘은 여기부터 하면 돼요</div>
            <div style={{display:"flex", alignItems:"center", gap:12, marginTop:10}}>
              <div style={{fontSize:34*S}}>{unitInfo(nextDay.unit).emoji}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:13*S, fontWeight:700, color:INK3}}>{unitInfo(nextDay.unit).titleKo} · {nextDay.day}일차</div>
                <div style={{fontSize:20*S, fontWeight:900, color:INK, marginTop:2}}>{nextDay.titleKo}</div>
              </div>
              <div style={{fontSize:14*S, fontWeight:800, color:"#fff", background:"#E07A5F", padding:"10px 16px", borderRadius:14}}>시작 →</div>
            </div>
          </div>
        ) : (
          <div style={{marginTop:14, background:"#ECF3E2", border:"2px solid #7A9E5E", borderRadius:20, padding:"22px 18px", textAlign:"center"}}>
            <div style={{fontSize:30*S}}>🎉</div>
            <div style={{fontSize:19*S, fontWeight:900, color:"#4d6b34", marginTop:6}}>64일 과정을 다 마치셨어요!</div>
            <div style={{fontSize:14*S, color:INK2, marginTop:6, lineHeight:1.5}}>이제 단원마다 <b>복습 카드</b>로 반복하면<br/>입에 착 붙을 거예요.</div>
          </div>
        )}

        <div style={{marginTop:20}}>
          <div style={{fontSize:13*S, fontWeight:800, color:INK3, letterSpacing:"0.06em", marginBottom:10}}>📚 단원 고르기 (왼쪽부터 차례로)</div>
          <div style={{display:"flex", gap:9, overflowX:"auto", padding:"0 16px 6px", margin:"0 -16px"}}>
            {UNITS.map(u=>{ const act=u.id===activeUnit; const dn=unitDoneCount(u.id), tt=unitDays(u.id).length; const complete=dn===tt;
              return (
                <button key={u.id} onClick={()=>setActiveUnit(u.id)} style={{flex:"0 0 auto", width:120, cursor:"pointer", borderRadius:18, padding:"12px 8px 11px", border:"2.5px solid "+(act?u.color:"#ece0cd"), background:act?u.bg:"#fff", textAlign:"center", fontFamily:FONT_KO, boxShadow:act?"0 4px 12px "+u.color+"33":"none"}}>
                  <div style={{fontSize:26*S}}>{u.emoji}</div>
                  <div style={{fontSize:13*S, fontWeight:900, color:act?u.color:INK, marginTop:5, lineHeight:1.2, minHeight:34}}>{u.titleKo}</div>
                  <div style={{fontSize:11.5*S, fontWeight:800, color:complete?"#7A9E5E":INK3, marginTop:4}}>{complete?"✓ 완료":dn+"/"+tt}</div>
                </button>
              ); })}
          </div>
        </div>

        <div style={{marginTop:14, background:BG, border:"2px solid "+C+"55", borderRadius:18, padding:"15px 16px"}}>
          <div style={{display:"flex", alignItems:"center", gap:11}}>
            <div style={{fontSize:30*S}}>{ap.emoji}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:20*S, fontWeight:900, color:INK}}>{ap.titleKo}</div>
              <div style={{fontSize:13*S, fontWeight:700, color:C}}>{ap.titleEn}</div>
            </div>
          </div>
          <button onClick={()=>setPracticeUnit(activeUnit)} style={{marginTop:13, width:"100%", cursor:"pointer", fontSize:16*S, fontWeight:900, fontFamily:FONT_KO, background:C, color:"#fff", border:"none", borderRadius:14, padding:"13px 0", boxShadow:"0 4px 12px "+C+"55"}}>🃏 이 단원 복습 카드로 외우기</button>
        </div>

        {unitDays(activeUnit).map(d=>{
          const gIdx=DAYS.findIndex(x=>x.id===d.id);
          const isDone=!!done[d.id];
          const review=reviewFor(gIdx);
          const ansOpen=!!showAns[d.id];
          return (
            <div key={d.id} ref={el=>dayRefs.current[d.id]=el} style={{marginTop:16, background:CARD, borderRadius:22, overflow:"hidden", border:"2px solid "+(isDone?C:"#efe3d0"), boxShadow:"0 4px 16px rgba(58,44,34,0.06)"}}>
              <div style={{display:"flex", alignItems:"center", gap:11, padding:"15px 17px", background:isDone?BG:"#fff", borderBottom:"1px solid "+(isDone?C+"33":"#f0e7d6")}}>
                <div style={{flexShrink:0, fontSize:13*S, fontWeight:900, color:"#fff", background:C, padding:"6px 12px", borderRadius:11}}>{d.day}일차</div>
                <div style={{flex:1, fontSize:19*S, fontWeight:900, color:INK}}>{d.titleKo}</div>
                {isDone && <div style={{fontSize:13*S, fontWeight:800, color:C}}>✓ 완료</div>}
              </div>

              <div style={{margin:"14px 14px 4px", background:"linear-gradient(135deg,"+BG+",#fff)", border:"2px solid "+C+"66", borderRadius:16, padding:"15px 16px"}}>
                <div style={{fontSize:12.5*S, fontWeight:900, color:C, letterSpacing:"0.08em"}}>✏️ 오늘의 문법</div>
                <div style={{fontSize:19*S, fontWeight:900, color:INK, marginTop:6, lineHeight:1.3}}>{d.grammar.point}</div>
                <div style={{display:"inline-block", marginTop:9, fontFamily:FONT_EN, fontSize:15*S, fontWeight:800, color:C, background:"#fff", border:"1.5px solid "+C+"55", borderRadius:10, padding:"6px 11px"}}>{d.grammar.pattern}</div>
                <div style={{fontSize:14.5*S, color:INK2, marginTop:10, lineHeight:1.6, fontWeight:500}}>{d.grammar.explain}</div>
              </div>

              <div style={{padding:"4px 14px"}}>
                <div style={{fontSize:12.5*S, fontWeight:900, color:INK3, margin:"8px 4px 2px"}}>📖 이렇게 말해요 (소리 듣고 따라 말하기)</div>
                {d.phrases.map((p,i)=>(<PhraseCard key={i} p={p} C={C} BG={BG} showKo={showKo} showEn={showEn} S={S} speak={speak} />))}
              </div>

              <div style={{margin:"6px 14px 4px", background:"#FFF8EE", border:"2px solid "+C+"55", borderRadius:16, padding:"14px 15px"}}>
                <div style={{fontSize:13*S, fontWeight:900, color:C}}>🗣️ 직접 말해보기</div>
                <div style={{fontSize:13*S, color:INK3, marginTop:3, marginBottom:9}}>오늘 배운 문법으로 이 말을 영어로 해보세요.</div>
                <div style={{fontSize:18*S, fontWeight:800, color:INK, lineHeight:1.4}}>“{d.practice.ask}”</div>
                {!ansOpen ? (
                  <button onClick={()=>toggleAns(d.id)} style={{marginTop:11, cursor:"pointer", fontSize:14*S, fontWeight:800, color:"#fff", background:C, border:"none", borderRadius:12, padding:"9px 16px", fontFamily:FONT_KO}}>정답 보기 →</button>
                ) : (
                  <div style={{marginTop:11, display:"flex", alignItems:"center", gap:11, background:"#fff", border:"1.5px solid "+C+"55", borderRadius:13, padding:"12px 13px"}}>
                    <button onClick={()=>speak(d.practice.en)} style={{flexShrink:0, width:46*S, height:46*S, borderRadius:14, cursor:"pointer", border:"none", background:BG, color:C, fontSize:21*S, boxShadow:"0 2px 6px "+C+"33"}}>🔊</button>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontFamily:FONT_EN, fontSize:21*S, fontWeight:800, color:INK, lineHeight:1.25}}>{d.practice.en}</div>
                      <div style={{fontSize:14*S, fontWeight:700, color:C, marginTop:2}}>[ {d.practice.pron} ]</div>
                    </div>
                  </div>
                )}
              </div>

              {review.length>0 && (
                <div style={{margin:"8px 14px 14px", background:"#fbf6ee", border:"1.5px dashed "+C+"66", borderRadius:16, padding:"13px 14px"}}>
                  <div style={{fontSize:13*S, fontWeight:900, color:C, marginBottom:4}}>🔁 잠깐 복습 (며칠 전에 배운 거예요)</div>
                  <div style={{fontSize:12.5*S, color:INK3, marginBottom:10}}>까먹기 전에 한 번 더! 소리 버튼을 누르고 따라 말해 보세요.</div>
                  {review.map((p,i)=>(<ReviewRow key={i} p={p} C={C} showKo={showKo} showEn={showEn} S={S} speak={speak} />))}
                </div>
              )}

              <div style={{padding:"0 14px 16px"}}>
                <button onClick={()=>toggleDone(d.id)} style={{width:"100%", cursor:"pointer", fontSize:17*S, fontWeight:900, fontFamily:FONT_KO, padding:"15px 0", borderRadius:16, border:"2.5px solid "+C, background:isDone?"#fff":C, color:isDone?C:"#fff", boxShadow:isDone?"none":"0 4px 12px "+C+"55"}}>{isDone?"↩︎ 다시 공부하기":"✓ 오늘 다 했어요!"}</button>
              </div>
            </div>
          );
        })}

        <div style={{marginTop:24, background:"#fff", border:"1px solid #efe3d0", borderRadius:18, padding:"17px 18px"}}>
          <div style={{fontSize:15*S, fontWeight:900, color:INK, marginBottom:11}}>💡 이렇게 하면 진짜 늘어요</div>
          {[
            ["1","‘오늘의 문법’을 먼저 읽고, 예문이 그 규칙을 어떻게 쓰는지 확인하기."],
            ["2","🔊 소리 버튼을 누르고 꼭 입으로 따라 말하기 — 눈으로만 보면 까먹어요."],
            ["3","‘직접 말해보기’는 정답을 보기 전에 먼저 스스로 말해보기! 이게 실력을 만들어요."],
            ["4","‘잠깐 복습’이 며칠 전 문장을 다시 꺼내줘요. 안 까먹는 비결이에요."],
            ["5","주말엔 🃏 복습 카드로 그동안 배운 단원을 쭉 넘겨 보세요."],
          ].map(([n,t])=>(
            <div key={n} style={{display:"flex", gap:11, marginBottom:10, alignItems:"flex-start"}}>
              <div style={{flexShrink:0, width:24*S, height:24*S, borderRadius:99, background:"#FBEAE3", color:"#C25A40", fontSize:13*S, fontWeight:900, display:"flex", alignItems:"center", justifyContent:"center"}}>{n}</div>
              <div style={{fontSize:14.5*S, color:INK2, lineHeight:1.55}}>{t}</div>
            </div>
          ))}
          <div style={{marginTop:6, fontSize:12.5*S, color:INK3, lineHeight:1.5, paddingTop:11, borderTop:"1px dashed #ecdfca"}}>진행 상황은 이 기기에 자동으로 저장돼요. 같은 컴퓨터·휴대폰에서 열면 이어서 할 수 있어요.</div>
        </div>
      </div>
    </div>
  );
}

function PhraseCard({p,C,BG,showKo,showEn,S,speak}){
  return (
    <div style={{display:"flex", alignItems:"center", gap:12, padding:"14px 4px", borderBottom:"1px solid #f4ecdd"}}>
      <button onClick={()=>speak(p.en)} aria-label="소리 듣기" style={{flexShrink:0, width:52*S, height:52*S, borderRadius:16, cursor:"pointer", border:"none", background:BG, color:C, fontSize:24*S, display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"0 2px 6px "+C+"33"}}>🔊</button>
      <div style={{flex:1, minWidth:0}}>
        {showEn && <div style={{fontFamily:FONT_EN, fontSize:23*S, fontWeight:800, color:INK, lineHeight:1.25, letterSpacing:"-0.01em"}}>{p.en}</div>}
        {showEn && <div style={{fontSize:15*S, fontWeight:700, color:C, marginTop:3}}>[ {p.pron} ]</div>}
        {showKo && <div style={{fontSize:16*S, color:INK2, marginTop:showEn?5:0, fontWeight:500, lineHeight:1.4}}>{p.ko}</div>}
      </div>
    </div>
  );
}

function ReviewRow({p,C,showKo,showEn,S,speak}){
  return (
    <div style={{display:"flex", alignItems:"center", gap:10, padding:"8px 0"}}>
      <button onClick={()=>speak(p.en)} style={{flexShrink:0, width:40*S, height:40*S, borderRadius:12, cursor:"pointer", border:"1.5px solid "+C+"55", background:"#fff", color:C, fontSize:18*S}}>🔊</button>
      <div style={{flex:1, minWidth:0}}>
        {showEn && <div style={{fontFamily:FONT_EN, fontSize:18*S, fontWeight:800, color:INK, lineHeight:1.25}}>{p.en} <span style={{fontFamily:FONT_KO, fontSize:13*S, fontWeight:700, color:C}}>[{p.pron}]</span></div>}
        {showKo && <div style={{fontSize:14*S, color:INK2, marginTop:showEn?2:0}}>{p.ko}</div>}
      </div>
    </div>
  );
}

function Flashcards({unit,days,speak,onClose,S}){
  const cards=[]; days.forEach(d=>d.phrases.forEach(p=>cards.push(p)));
  const [idx,setIdx]=useState(0);
  const [flipped,setFlipped]=useState(false);
  const C=unit.color, BG=unit.bg, card=cards[idx];
  const go=(n)=>{ setFlipped(false); setIdx(i=>(i+n+cards.length)%cards.length); };
  return (
    <div style={{minHeight:"100vh", background:BG, fontFamily:FONT_KO, color:INK, display:"flex", flexDirection:"column"}}>
      <div style={{padding:"20px 18px 0", maxWidth:520, width:"100%", margin:"0 auto"}}>
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between"}}>
          <div style={{fontSize:18*S, fontWeight:900, color:C}}>{unit.emoji} {unit.titleKo} 복습</div>
          <button onClick={onClose} style={{cursor:"pointer", fontSize:15*S, fontWeight:800, color:INK2, background:"#fff", border:"2px solid "+C+"44", borderRadius:12, padding:"8px 14px", fontFamily:FONT_KO}}>✕ 닫기</button>
        </div>
        <div style={{fontSize:14*S, fontWeight:700, color:INK3, marginTop:8}}>{idx+1} / {cards.length} 장</div>
      </div>

      <div style={{flex:1, display:"flex", alignItems:"center", justifyContent:"center", padding:"18px"}}>
        <div onClick={()=>setFlipped(f=>!f)} style={{width:"100%", maxWidth:480, minHeight:300, cursor:"pointer", background:"#fff", borderRadius:28, border:"3px solid "+C, boxShadow:"0 10px 30px "+C+"33", padding:"30px 24px", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", textAlign:"center"}}>
          {!flipped ? (
            <React.Fragment>
              <div style={{fontSize:13*S, fontWeight:800, color:C, letterSpacing:"0.08em"}}>영어 (눌러서 듣기 🔊)</div>
              <div style={{fontFamily:FONT_EN, fontSize:32*S, fontWeight:900, color:INK, margin:"18px 0", lineHeight:1.25}}>{card.en}</div>
              <div style={{fontSize:18*S, fontWeight:800, color:C}}>[ {card.pron} ]</div>
              <button onClick={(e)=>{e.stopPropagation(); speak(card.en);}} style={{marginTop:22, cursor:"pointer", fontSize:22*S, width:64*S, height:64*S, borderRadius:99, border:"none", background:BG, color:C, boxShadow:"0 3px 10px "+C+"44"}}>🔊</button>
              <div style={{marginTop:18, fontSize:13.5*S, color:INK3, fontWeight:700}}>👆 카드를 누르면 뜻이 나와요</div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div style={{fontSize:13*S, fontWeight:800, color:C, letterSpacing:"0.08em"}}>뜻</div>
              <div style={{fontSize:25*S, fontWeight:900, color:INK, margin:"20px 0", lineHeight:1.4}}>{card.ko}</div>
              <div style={{fontFamily:FONT_EN, fontSize:19*S, fontWeight:800, color:INK2}}>{card.en}</div>
              <div style={{fontSize:15*S, fontWeight:800, color:C, marginTop:6}}>[ {card.pron} ]</div>
              <div style={{marginTop:18, fontSize:13.5*S, color:INK3, fontWeight:700}}>👆 다시 누르면 영어로</div>
            </React.Fragment>
          )}
        </div>
      </div>

      <div style={{padding:"0 18px 30px", maxWidth:480, width:"100%", margin:"0 auto", display:"flex", gap:12}}>
        <button onClick={()=>go(-1)} style={{flex:1, cursor:"pointer", fontSize:17*S, fontWeight:900, fontFamily:FONT_KO, padding:"15px 0", borderRadius:16, border:"2.5px solid "+C, background:"#fff", color:C}}>← 이전</button>
        <button onClick={()=>go(1)}  style={{flex:1, cursor:"pointer", fontSize:17*S, fontWeight:900, fontFamily:FONT_KO, padding:"15px 0", borderRadius:16, border:"none", background:C, color:"#fff", boxShadow:"0 4px 12px "+C+"55"}}>다음 →</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
